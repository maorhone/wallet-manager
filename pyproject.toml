[project]
name = "wallet-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy[asyncio]>=2", "asyncpg", "alembic",
  "pydantic>=2", "pydantic-settings", "httpx", "authlib", "itsdangerous",
  "pyjwt[crypto]", "prometheus-client", "pyyaml", "ldap3>=2.9.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-timeout", "respx", "ruff", "pgembed"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "respx",
    "ruff",
    "pgembed",
    "hypothesis>=6.170.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 60
testpaths = ["tests"]
