  - { group: 'CN=wm-admins,OU=Groups,DC=corp,DC=example', role: platform_admin, scope_kind: global }
  - {
      group: 'CN=wm-rep-d1,OU=Groups,DC=corp,DC=example',
      role: department_rep,
      scope_kind: department,
      scope: D1,
    }
  - {
      group: 'CN=wm-pmo-d1,OU=Groups,DC=corp,DC=example',
      role: pmo,
      scope_kind: department,
      scope: D1,
    }
  - {
