# Dev fixture: WM rows plus the fixture directory (users -> AD group DNs). Step 4.
policies:
  concurrency: { min: 1, default: 4, max: 8 }
  rpm: { min: 1, default: 120, max: 600 }
  overalloc_factor_default: 1.0
  thresholds: { near: 0.8, full: 1.0 }

departments:
  - key: D1
    name: Department D1
    ad_group_dn: CN=dept-d1,OU=Groups,DC=corp,DC=example
    budget: 1000000
    pmo_pool: 180000
    reserve: 50000
    groups:
      - {
          key: A1,
          name: Group A1,
          ad_group_dn: 'CN=grp-a1,OU=Groups,DC=corp,DC=example',
          base_budget: 250000,
        }
      - {
          key: A2,
          name: Group A2,
          ad_group_dn: 'CN=grp-a2,OU=Groups,DC=corp,DC=example',
          base_budget: 150000,
        }
      - {
          key: B1,
          name: Group B1,
          ad_group_dn: 'CN=grp-b1,OU=Groups,DC=corp,DC=example',
          base_budget: 350000,
        }
      - {
          key: D1-staff,
          name: D1 staff,
          kind: department_staff,
          ad_group_dn: 'CN=grp-d1-staff,OU=Groups,DC=corp,DC=example',
          base_budget: 20000,
        }
  - key: D2
    name: Department D2
    ad_group_dn: CN=dept-d2,OU=Groups,DC=corp,DC=example
    budget: 500000
    groups:
      - {
          key: C1,
          name: Group C1,
          ad_group_dn: 'CN=grp-c1,OU=Groups,DC=corp,DC=example',
          base_budget: 300000,
        }
      - {
          key: D2-staff,
          name: D2 staff,
          kind: department_staff,
          ad_group_dn: 'CN=grp-d2-staff,OU=Groups,DC=corp,DC=example',
          base_budget: 20000,
        }

